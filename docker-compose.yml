services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkadia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: arkadia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkadia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/beicho/arkadia-sub:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://arkadia:${POSTGRES_PASSWORD}@db:5432/arkadia
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      APP_URL: ${APP_URL:-https://arkadia.work}
      LINUXDO_CLIENT_ID: ${LINUXDO_CLIENT_ID:-}
      LINUXDO_CLIENT_SECRET: ${LINUXDO_CLIENT_SECRET:-}
      LDC_PID: ${LDC_PID:-}
      LDC_KEY: ${LDC_KEY:-}
      LDC_EPAY_BASE: ${LDC_EPAY_BASE:-https://credit.linux.do/epay}
      DEV_FAKE_LOGIN: ${DEV_FAKE_LOGIN:-0}
    ports:
      - "127.0.0.1:3090:3000"
    # 镜像是 CI 从 Dockerfile build 出来的,服务器不 build

  migrate:
    image: ghcr.io/beicho/arkadia-sub:migrate
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://arkadia:${POSTGRES_PASSWORD}@db:5432/arkadia

volumes:
  pgdata:
