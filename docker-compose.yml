services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkadia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: arkadia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkadia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/beicho/arkadia-sub:latest
    build:
      context: .
      target: run
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://arkadia:${POSTGRES_PASSWORD}@db:5432/arkadia
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      APP_URL: ${APP_URL:-http://localhost:3090}
      LINUXDO_CLIENT_ID: ${LINUXDO_CLIENT_ID:-}
      LINUXDO_CLIENT_SECRET: ${LINUXDO_CLIENT_SECRET:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      LDC_PID: ${LDC_PID:-}
      LDC_KEY: ${LDC_KEY:-}
      LDC_EPAY_BASE: ${LDC_EPAY_BASE:-https://credit.linux.do/epay}
      LDC_ORDER_EXPIRE_MINUTES: ${LDC_ORDER_EXPIRE_MINUTES:-5}
      UPSTREAM_SUBSCRIPTION_URL: ${UPSTREAM_SUBSCRIPTION_URL:-}
      DEV_FAKE_LOGIN: ${DEV_FAKE_LOGIN:-0}
    ports:
      - "127.0.0.1:3090:3000"
    # 生产服务器使用 CI 镜像；源码部署可先运行 docker compose build app migrate

  migrate:
    image: ghcr.io/beicho/arkadia-sub:migrate
    build:
      context: .
      target: migrate-tools
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://arkadia:${POSTGRES_PASSWORD}@db:5432/arkadia

volumes:
  pgdata:
