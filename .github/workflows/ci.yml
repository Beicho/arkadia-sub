name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    name: test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arkadia
          POSTGRES_PASSWORD: arkadia
          POSTGRES_DB: arkadia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkadia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://arkadia:arkadia@localhost:5432/arkadia_test
      SESSION_SECRET: ci-test-secret-not-for-production
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push database schema (drizzle-kit)
        run: npx --no-install drizzle-kit push --force

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (next build)
        run: npm run build
