name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arkadia
          POSTGRES_PASSWORD: arkadia
          POSTGRES_DB: arkadia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkadia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://arkadia:arkadia@localhost:5432/arkadia_test
      SESSION_SECRET: ci-test-secret-not-for-production
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push database schema (drizzle-kit)
        run: npx --no-install drizzle-kit push --force

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (next build)
        run: npm run build

  docker:
    name: build & push image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # run 阶段 = 生产镜像;migrate-tools 阶段含 node_modules,专门跑 drizzle-kit push
          target: run
          push: true
          tags: |
            ghcr.io/beicho/arkadia-sub:latest
            ghcr.io/beicho/arkadia-sub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image (local export)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate-tools
          push: true
          tags: ghcr.io/beicho/arkadia-sub:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max
